[PHP]
; Blog admin — cover images & large CKEditor posts (Plesk/IIS + XAMPP)
upload_max_filesize=25M
post_max_size=80M
max_input_time=300
max_execution_time=300
memory_limit=256M
; Plesk vhost tmp (PHP falls back to system temp if path missing, e.g. local XAMPP)
upload_tmp_dir=C:/Inetpub/vhosts/bisanibrothers.com/tmp
